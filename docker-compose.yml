services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: preclinic
      POSTGRES_PASSWORD: preclinic
      POSTGRES_DB: preclinic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preclinic"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://preclinic:preclinic@db:5432/preclinic
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me
      APP_ENV: production
      REQUIRE_ADMIN_2FA: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
