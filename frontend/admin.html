<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin · Preclinic IQ AI</title>
  <link rel="stylesheet" href="/css/base.css?v=12" />
  <link rel="stylesheet" href="/css/layout.css?v=12" />
  <link rel="stylesheet" href="/css/components.css?v=6" />
  <link rel="stylesheet" href="/css/admin.css?v=2" />
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <img src="/assets/emblem.png" alt="" />
        <div><h1>Preclinic IQ AI</h1><small data-i18n="roleAdmin">Admin</small></div>
      </div>
      <div class="lang-switch dark">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="hi">हिं</button>
        <button type="button" data-lang="ta">த</button>
        <button type="button" data-lang="bn">বাং</button>
      </div>
      <nav class="nav" id="admNav">
        <a href="#dashboard" class="active" data-adm="dashboard"><span class="ic-slot"></span><span>Dashboard</span></a>
        <a href="#patients" data-adm="patients"><span class="ic-slot"></span><span>Patient Management</span></a>
        <a href="#doctors" data-adm="doctors"><span class="ic-slot"></span><span>Doctor Management</span></a>
        <a href="#visits-docs" data-adm="visits-docs"><span class="ic-slot"></span><span>Visits &amp; Documents</span></a>
        <a href="#emergency-audit" data-adm="emergency-audit"><span class="ic-slot"></span><span>Emergency &amp; Audit</span></a>
        <a href="#" id="logoutBtn" class="logout-item"><span class="ic-slot"></span><span data-i18n="navOut">Sign out</span></a>
      </nav>
      <div class="side-foot" data-i18n="sideFootA">SIH 26047 · Ministry of Ayush · AIIA</div>
    </aside>
    <main class="main">
      <div class="topbar">
        <div>
          <div class="eyebrow" data-i18n="adminEyebrow">Administration</div>
          <h2 data-i18n="adminTitle">System control room</h2>
        </div>
        <div class="who"><strong id="whoName">—</strong><span class="small muted" id="whoMeta"></span></div>
      </div>
      <div id="emergencyBanner" class="banner-em hidden"></div>
      <main id="admMain" aria-live="polite"></main>
    </main>
  </div>
  <script src="/js/boot.js?v=11"></script>
  <script src="/js/api.js?v=12"></script>
  <script src="/js/auth.js?v=11"></script>
  <script src="/js/common.js?v=11"></script>
  <script src="/js/i18n.js?v=13"></script>
  <script src="/js/emergency.js?v=11"></script>
  <script src="/js/documents.js?v=11"></script>
  <script src="/js/docViewer.js?v=11"></script>
  <script src="/js/admin.js?v=2"></script>
</body>
</html>
